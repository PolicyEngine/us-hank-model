name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request supersedes the run in progress. Runs
# on main are never cancelled: each one sends the MacroMod dispatch below.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Whole job: install about 20 seconds, fast tests about 1 minute, slow
    # suite 3 to 6 minutes. Without this a hung install or fast test would
    # run to the 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      - name: Fast tests
        run: pytest -q
      # The production-grid suite (steady state, Jacobian, scenario sweep,
      # nonlinear transition paths) takes about 5 minutes on CI, so it runs on
      # every PR as well: a gate that only runs after merge protects nothing.
      - name: Full production-grid validation (slow suite, every PR)
        timeout-minutes: 20
        run: pytest --runslow -q

  dispatch:
    name: Notify PolicyEngine Macro (MacroMod)
    # Same pattern as PolicyEngine/obr-macroeconomic-model's
    # notify-macromod.yml (which dispatches to PolicyEngine/macro).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger MacroMod redeploy
        run: |
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.MACROMOD_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/PolicyEngine/macro/dispatches \
            -d '{"event_type":"model-updated","client_payload":{"repo":"us-hank-model","sha":"${{ github.sha }}"}}'
