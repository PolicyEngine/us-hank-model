[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "us-hank-model"
version = "0.1.0"
description = "US two-asset HANK model (Auclert, Bardoczy, Rognlie & Straub 2021) packaged for PolicyEngine MacroMod: steady state, stylized shocks, and distributional output via sequence-jacobian."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "PolicyEngine" }]
# sequence-jacobian is pinned exactly: the replication asserts published
# parameter values to 4 decimals, so the solver version is part of the result.
# The numeric stack carries major-version ceilings for the same reason — a
# silent NumPy/SciPy major bump must not be able to move those digits without
# anyone choosing it. test_internally_calibrated_parameters_match_published_table
# is the backstop that makes such a move fail loudly rather than quietly.
dependencies = [
    "sequence-jacobian==1.0.0",
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "numba>=0.57,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/us_hank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow tests (full-grid steady state / jacobian solves; run with --runslow or in CI)",
]
